    <!-- ================= 核心 3D、自動轉正防穿模抓取／收回、高畫質分享連結邏輯 ================= -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 統一產生郵標 SVG
        const UNIFIED_STAMP_SVG = `
            <svg viewBox="0 0 210 95" class="w-40 h-20">
                <path d="M 6,34 Q 24,25 42,34 T 78,34 M 6,47 Q 24,38 42,47 T 78,47 M 6,60 Q 24,51 42,60 T 78,60" fill="none" stroke="#1F4E3D" stroke-width="2.2" stroke-linecap="round"/>
                <rect x="132" y="8" width="68" height="78" fill="#F7F3EB" stroke="#B8292F" stroke-width="3.2" stroke-dasharray="7,5"/>
                <rect x="140" y="16" width="52" height="62" fill="none" stroke="#B8292F" stroke-width="1.5"/>
                <g transform="translate(166, 47)" stroke="#B8292F" stroke-width="2" stroke-linecap="round">
                    <line x1="0" y1="-16" x2="0" y2="16"/><line x1="-14" y1="-8" x2="14" y2="8"/><line x1="-14" y1="8" x2="14" y2="-8"/>
                    <path d="M-4,-11 L0,-7 L4,-11 M-4,11 L0,7 L4,11 M-11,-2 L-6,-3 L-7,-8 M11,2 L6,3 L7,8 M-7,8 L-6,3 L-11,2 M7,-8 L6,-3 L11,-2" fill="none"/>
                </g>
                <circle cx="110" cy="47" r="28" fill="none" stroke="#1F4E3D" stroke-width="2.2" stroke-dasharray="4,3"/>
                <circle cx="110" cy="47" r="22" fill="none" stroke="#1F4E3D" stroke-width="1.6"/>
                <g transform="translate(110, 49)">
                    <path d="M -11,4 C -9,-10 2,-15 11,-6 C 8,-2 5,1 4,4 Z" fill="#1F4E3D"/>
                    <rect x="-13" y="3" width="21" height="5" rx="2.5" fill="#F7F3EB" stroke="#1F4E3D" stroke-width="1.6"/>
                    <circle cx="12" cy="-5" r="3.5" fill="#F7F3EB" stroke="#1F4E3D" stroke-width="1.6"/>
                </g>
            </svg>
        `;
        document.querySelectorAll('.stamp-postmark-slot').forEach(el => { el.innerHTML = UNIFIED_STAMP_SVG; });

        // --- 全域狀態 ---
        const State = {
            mode: 'EDIT', // EDIT -> CARD_CLOSED -> CARD_OPEN -> TREE_VIEW -> PHOTO_ZOOM -> ENDING
            glbCandidates: ['./christmas_tree.glb', 'christmas_tree.glb', './base_basic_shaded.glb'],
            loadedGLTF: null,
            toText: 'My Dearest Friend',
            bodyText: 'May your holidays sparkle with joy and laughter! Wishing you a wonderful Christmas.',
            fromText: 'With Love',
            rawImageURLs: [],
            shareImageURLs: [],
            activePolaroid: null,
            viewedSet: new Set(),
            isAnimating: false,
            handX: 0.5,
            rotOffset: 0 // 補償自動轉正聖誕樹後的旋轉基準角
        };

        let scene, overlayScene, camera, renderer, controls;
        let cardGroup, cardLeftPivot, cardRightPivot, cardInnerRightMesh, cardInnerLeftMesh, cardCoverMesh;
        let treeRootGroup, treeModelGroup, treeMeshesList = [], polaroids = [];
        let snowSystem, magicEffects = [];
        let audioCtx;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clock = new THREE.Clock();

        function showToast(msg) {
            const t = document.getElementById('toast-msg');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3200);
        }

        function compressImageForShare(file, targetSize = 800, quality = 0.86) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const minSide = Math.min(img.width, img.height);
                        const finalDim = Math.min(minSide, targetSize);
                        canvas.width = finalDim;
                        canvas.height = finalDim;

                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        const sx = (img.width - minSide) / 2;
                        const sy = (img.height - minSide) / 2;
                        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, finalDim, finalDim);

                        let dataUrl = canvas.toDataURL('image/webp', quality);
                        if (!dataUrl.startsWith('data:image/webp')) {
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        resolve(dataUrl);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function encodeSharePayload(obj) {
            const jsonStr = JSON.stringify(obj);
            const utf8Bytes = new TextEncoder().encode(jsonStr);

            if (typeof CompressionStream !== 'undefined') {
                try {
                    const cs = new CompressionStream('deflate-raw');
                    const writer = cs.writable.getWriter();
                    writer.write(utf8Bytes);
                    writer.close();
                    const compressedBuf = await new Response(cs.readable).arrayBuffer();
                    const compressedBytes = new Uint8Array(compressedBuf);
                    let binaryStr = '';
                    for (let i = 0; i < compressedBytes.length; i++) {
                        binaryStr += String.fromCharCode(compressedBytes[i]);
                    }
                    return 'z_' + btoa(binaryStr).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                } catch (e) {}
            }

            let binaryStr = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binaryStr += String.fromCharCode(utf8Bytes[i]);
            }
            return btoa(binaryStr).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function decodeSharePayload(str) {
            try {
                if (str.startsWith('%7B') || str.startsWith('{')) {
                    return JSON.parse(decodeURIComponent(str));
                }
                const isCompressed = str.startsWith('z_');
                let rawB64 = isCompressed ? str.slice(2) : str;
                let b64 = rawB64.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';

                const binaryStr = atob(b64);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }

                if (isCompressed && typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('deflate-raw');
                    const writer = ds.writable.getWriter();
                    writer.write(bytes);
                    writer.close();
                    const decompressedBuf = await new Response(ds.readable).arrayBuffer();
                    const jsonStr = new TextDecoder().decode(new Uint8Array(decompressedBuf));
                    return JSON.parse(jsonStr);
                }

                const jsonStr = new TextDecoder().decode(bytes);
                return JSON.parse(jsonStr);
            } catch (e) {
                console.warn('分享連結解碼失敗:', e);
                return null;
            }
        }

        async function generateAndCopyShareLink() {
            const payload = {
                t: State.toText,
                b: State.bodyText,
                f: State.fromText,
                imgs: State.shareImageURLs.length > 0 ? State.shareImageURLs : State.rawImageURLs
            };

            try {
                const encoded = await encodeSharePayload(payload);
                const baseUrl = window.location.href.split('#')[0].split('?')[0];
                const shareUrl = `${baseUrl}#share=${encoded}`;
                window.history.replaceState(null, '', `#share=${encoded}`);

                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(shareUrl);
                } else {
                    const tempInput = document.createElement('textarea');
                    tempInput.value = shareUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                }

                showToast('✓ 已複製專屬祝福連結！');
            } catch (err) {
                showToast('✓ 已複製專屬祝福連結！');
            }
        }

        async function checkSharedDataFromURL() {
            let rawParam = null;
            if (window.location.hash && window.location.hash.includes('share=')) {
                rawParam = window.location.hash.split('share=')[1];
            } else if (window.location.search && window.location.search.includes('share=')) {
                rawParam = new URLSearchParams(window.location.search).get('share');
            }
            if (rawParam) {
                const data = await decodeSharePayload(rawParam);
                if (data) {
                    if (data.t) State.toText = data.t;
                    if (data.b) State.bodyText = data.b;
                    if (data.f) State.fromText = data.f;
                    if (Array.isArray(data.imgs) && data.imgs.length > 0) {
                        State.rawImageURLs = data.imgs;
                        State.shareImageURLs = data.imgs;
                    }
                    return true;
                }
            }
            return false;
        }

        // --- 音效合成器 ---
        function playSound(type = 'chime') {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const notes = type === 'open'
                    ? [523.25, 659.25, 783.99, 1046.5]
                    : type === 'finale'
                    ? [523.25, 659.25, 783.99, 987.77, 1046.5, 1318.5]
                    : [783.99, 987.77, 1174.66];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.85);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.09);
                    osc.stop(now + idx * 0.09 + 0.85);
                });
            } catch (e) {}
        }

        function preloadDefaultGLB(onReadyCallback) {
            const loader = new GLTFLoader();
            function tryNext(index) {
                if (index >= State.glbCandidates.length) {
                    if (onReadyCallback) onReadyCallback(false);
                    return;
                }
                const url = State.glbCandidates[index];
                loader.load(
                    url,
                    (gltf) => {
                        State.loadedGLTF = gltf;
                        if (onReadyCallback) onReadyCallback(true);
                    },
                    undefined,
                    () => tryNext(index + 1)
                );
            }
            tryNext(0);
        }

        function setupGLBTreeModel(gltf) {
            if (treeModelGroup) {
                treeRootGroup.remove(treeModelGroup);
            }
            polaroids = [];
            treeMeshesList = [];
            State.viewedSet.clear();
            treeModelGroup = new THREE.Group();
            treeRootGroup.add(treeModelGroup);

            const model = gltf.scene.clone(true);

            model.traverse((child) => {
                if (child.isMesh) {
                    if (child.material) {
                        const bakedTex = child.material.emissiveMap || child.material.map;
                        if (bakedTex) {
                            bakedTex.colorSpace = THREE.SRGBColorSpace;
                            bakedTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            child.material = new THREE.MeshBasicMaterial({
                                map: bakedTex,
                                side: THREE.DoubleSide
                            });
                        }
                    }
                    treeMeshesList.push(child);
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const targetHeight = 6.4;
            const scaleFactor = targetHeight / Math.max(size.y, 0.1);
            model.scale.setScalar(scaleFactor);

            model.position.set(-center.x * scaleFactor, -box.min.y * scaleFactor, -center.z * scaleFactor);
            treeModelGroup.add(model);
            treeRootGroup.updateMatrixWorld(true);

            createHangingPolaroidsOnSurface(treeMeshesList, targetHeight, (Math.max(size.x, size.z) / 2) * scaleFactor);
        }

        function createPolaroidTexture(imageUrl, index, callback) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1240;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                ctx.fillStyle = '#FCFBF7';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                ctx.lineWidth = 8;
                ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

                const px = 72, py = 72, pw = 880, ph = 880;
                ctx.save();
                ctx.beginPath();
                ctx.rect(px, py, pw, ph);
                ctx.clip();

                const aspect = img.width / img.height;
                let drawW = pw, drawH = ph;
                if (aspect > 1) drawW = ph * aspect; else drawH = pw / aspect;
                ctx.drawImage(img, px + (pw - drawW) / 2, py + (ph - drawH) / 2, drawW, drawH);
                ctx.restore();

                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 4;
                ctx.strokeRect(px, py, pw, ph);

                const motifTypes = ['gingerbread', 'bell', 'bauble', 'reindeer'];
                drawRefinedPolaroidMotif(ctx, canvas.width / 2, 1094, 2.55, motifTypes[index % motifTypes.length]);

                const tex = new THREE.CanvasTexture(canvas);

                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                tex.minFilter = THREE.LinearMipmapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.needsUpdate = true;
                callback(tex);
            };
            img.src = imageUrl;
        }

        function createHangingPolaroidsOnSurface(treeMeshes, treeHeight, fallbackMaxR) {
            const count = State.rawImageURLs.length;
            const minY = treeHeight * 0.39;
            const maxY = treeHeight * 0.75;

            const cardW = 0.66, cardH = 0.82, cardD = 0.018;
            const backMat = new THREE.MeshBasicMaterial({ color: 0xF5F2EB });
            const surfaceRaycaster = new THREE.Raycaster();

            for (let i = 0; i < count; i++) {
                const anchorGroup = new THREE.Group();

                const t = count === 1 ? 0.5 : i / (count - 1);
                const localY = minY + t * (maxY - minY);
                const angle = i * 2.39996 + 0.6;

                let topMaxR = (1 - t * 0.65) * fallbackMaxR * 0.75;
                let bottomMaxR = topMaxR + 0.25;

                [-0.32, -0.16, 0, 0.16, 0.32].forEach(angleOffset => {
                    const a = angle + angleOffset;
                    const dx = Math.cos(a), dz = Math.sin(a);

                    [localY + 0.08, localY - cardH * 0.25, localY - cardH * 0.5].forEach(sy => {
                        const wy = sy + treeRootGroup.position.y;
                        surfaceRaycaster.set(new THREE.Vector3(dx * 10, wy, dz * 10), new THREE.Vector3(-dx, 0, -dz).normalize());
                        const hits = surfaceRaycaster.intersectObjects(treeMeshes, true);
                        if (hits.length > 0) {
                            const r = Math.hypot(hits[0].point.x, hits[0].point.z);
                            if (r > topMaxR) topMaxR = r;
                        }
                    });

                    [localY - cardH * 0.75, localY - cardH * 1.0, localY - cardH * 1.15].forEach(sy => {
                        const wy = sy + treeRootGroup.position.y;
                        surfaceRaycaster.set(new THREE.Vector3(dx * 10, wy, dz * 10), new THREE.Vector3(-dx, 0, -dz).normalize());
                        const hits = surfaceRaycaster.intersectObjects(treeMeshes, true);
                        if (hits.length > 0) {
                            const r = Math.hypot(hits[0].point.x, hits[0].point.z);
                            if (r > bottomMaxR) bottomMaxR = r;
                        }
                    });
                });

                const hangRadius = Math.max(topMaxR + 0.24, bottomMaxR + 0.08) + 0.14;
                const dirX = Math.cos(angle), dirZ = Math.sin(angle);

                anchorGroup.position.set(dirX * hangRadius, localY, dirZ * hangRadius);
                anchorGroup.rotation.y = -angle + Math.PI / 2;

                const radialDiff = Math.max(0.1, bottomMaxR - topMaxR + 0.14);
                const naturalSlopeAngle = -Math.min(0.28, Math.atan2(radialDiff, cardH));
                const naturalRollZ = ((i % 2 === 0 ? 1 : -1) * 0.055) + (Math.random() - 0.5) * 0.03;

                const polaroidCard = new THREE.Group();
                polaroidCard.rotation.set(naturalSlopeAngle, (Math.random() - 0.5) * 0.08, naturalRollZ);

                const cuteTopper = create3DCuteTopper(i);
                polaroidCard.add(cuteTopper);

                createPolaroidTexture(State.rawImageURLs[i], i, (frontTex) => {
                    const frontMat = new THREE.MeshBasicMaterial({ map: frontTex });

                    const bodyMats = [backMat, backMat, backMat, backMat, frontMat, backMat];
                    const photoMesh = new THREE.Mesh(new THREE.BoxGeometry(cardW, cardH, cardD), bodyMats);
                    photoMesh.position.set(0, -cardH / 2 + 0.02, 0);
                    polaroidCard.add(photoMesh);

                    polaroidCard.userData = {
                        isPolaroid: true,
                        index: i,
                        anchorAngle: angle, // 記錄此拍立得在樹上的環繞角度，供轉正對齊使用
                        anchorGroup: anchorGroup,
                        initialRot: polaroidCard.rotation.clone(),
                        swayPhase: Math.random() * Math.PI * 2
                    };
                    polaroids.push(polaroidCard);
                });

                anchorGroup.add(polaroidCard);
                treeModelGroup.add(anchorGroup);
            }
        }

        function emitGoldenSparkles(originY = 0.8, count = 85, spreadRadius = 3.2) {
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * spreadRadius;
                positions[i * 3] = Math.cos(angle) * r * 0.5;
                positions[i * 3 + 1] = originY + (Math.random() - 0.4) * 1.8;
                positions[i * 3 + 2] = Math.sin(angle) * r * 0.5 + 0.5;

                velocities.push({
                    vx: Math.cos(angle) * (0.015 + Math.random() * 0.025),
                    vy: 0.018 + Math.random() * 0.03,
                    vz: Math.sin(angle) * (0.015 + Math.random() * 0.025)
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.52,
                map: getStarSparkleTexture(),
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);

            const effectObj = { points, velocities };
            magicEffects.push(effectObj);

            gsap.to(mat, {
                opacity: 0,
                duration: 2.2,
                ease: 'power2.out',
                onComplete: () => {
                    scene.remove(points);
                    geo.dispose();
                    mat.dispose();
                    magicEffects = magicEffects.filter(e => e !== effectObj);
                }
            });
        }

        // 計算某張拍立得掛點目前與鏡頭正前方的水平角度差 (-PI ~ +PI)
        function getAngleDiffFromCameraFront(polaroidCard) {
            const anchorGroup = polaroidCard.userData.anchorGroup;
            const worldPos = new THREE.Vector3();
            anchorGroup.getWorldPosition(worldPos);

            // 拍立得相對於樹中心的水平向量 (即樹表面的朝外法線方向)
            const normalAngle = Math.atan2(worldPos.x, worldPos.z);
            // 攝影機相對於樹中心的水平角度
            const camAngle = Math.atan2(camera.position.x, camera.position.z);

            let diff = camAngle - normalAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return diff;
        }

        // 智慧挑選下一張要放大的拍立得：優先挑選「還沒看過、且目前最面對鏡頭正前方」的拍立得
        function getNextUnviewedPolaroid() {
            const unviewed = polaroids.filter(p => !State.viewedSet.has(p.userData.index));
            const pool = unviewed.length > 0 ? unviewed : polaroids;

            let bestCandidate = pool[0];
            let minAbsDiff = Infinity;
            pool.forEach(p => {
                const absDiff = Math.abs(getAngleDiffFromCameraFront(p));
                if (absDiff < minAbsDiff) {
                    minAbsDiff = absDiff;
                    bestCandidate = p;
                }
            });
            return bestCandidate;
        }

        // 【徹底解決從樹背面穿出問題】
        // 若目標拍立得位於聖誕樹側面或背面 (與鏡頭夾角 > 38 度)，先自動將聖誕樹平滑轉正，再從樹表面向外抽出拍立得
        function zoomPolaroid(polaroidCard) {
            if (State.mode !== 'TREE_VIEW' || State.isAnimating || !polaroidCard) return;
            State.isAnimating = true;
            playSound('open');

            State.activePolaroid = polaroidCard;
            State.viewedSet.add(polaroidCard.userData.index);
            controls.enableZoom = false;

            const angleDiff = getAngleDiffFromCameraFront(polaroidCard);
            const needRotateTree = Math.abs(angleDiff) > 0.65; // 約 37 度以外即視為側面/背面
            const rotateDuration = needRotateTree ? 0.55 : 0;

            const targetTreeRotY = treeRootGroup.rotation.y + angleDiff;
            if (needRotateTree) {
                State.rotOffset = targetTreeRotY - (0.5 - State.handX) * Math.PI * 1.6;
            }

            gsap.to(treeRootGroup.rotation, {
                y: needRotateTree ? targetTreeRotY : treeRootGroup.rotation.y,
                duration: rotateDuration,
                ease: 'power2.inOut',
                onComplete: () => {
                    treeRootGroup.updateMatrixWorld(true);
                    // 當拍立得已經轉到樹正前方表面後，移入獨立前景層 overlayScene 並飛向鏡頭
                    overlayScene.attach(polaroidCard);

                    const camDir = camera.getWorldDirection(new THREE.Vector3());
                    const camUp = camera.up.clone().applyQuaternion(camera.quaternion).normalize();
                    const targetPos = camera.position.clone()
                        .add(camDir.multiplyScalar(3.2))
                        .add(camUp.multiplyScalar(0.26));

                    gsap.to(polaroidCard.position, {
                        x: targetPos.x, y: targetPos.y, z: targetPos.z,
                        duration: 0.8, ease: 'power3.out'
                    });
                    gsap.to(polaroidCard.scale, {
                        x: 1.55, y: 1.55, z: 1.55,
                        duration: 0.8, ease: 'back.out(1.2)'
                    });

                    const lookMatrix = new THREE.Matrix4().lookAt(camera.position, targetPos, camera.up);
                    const targetQuat = new THREE.Quaternion().setFromRotationMatrix(lookMatrix);
                    gsap.to(polaroidCard.quaternion, {
                        x: targetQuat.x, y: targetQuat.y, z: targetQuat.z, w: targetQuat.w,
                        duration: 0.8, ease: 'power3.out',
                        onComplete: () => {
                            State.mode = 'PHOTO_ZOOM';
                            State.isAnimating = false;
                        }
                    });
                }
            });
        }

        // 【徹底解決收回時穿入樹肚子的問題】
        // 收回時先將掛點轉回正面，且拍立得全程留在 overlayScene (前景層) 飛行，抵達掛點表面瞬間才歸還至樹枝上
        function returnPolaroidToTree() {
            if (State.mode !== 'PHOTO_ZOOM' || State.isAnimating || !State.activePolaroid) return;
            State.isAnimating = true;
            playSound('chime');

            const polaroidCard = State.activePolaroid;
            const anchorGroup = polaroidCard.userData.anchorGroup;
            const initRot = polaroidCard.userData.initialRot;

            // 檢查這段期間使用者是否轉動了視角導致原本的掛點跑到樹背面
            const angleDiff = getAngleDiffFromCameraFront(polaroidCard);
            if (Math.abs(angleDiff) > 0.65) {
                const targetTreeRotY = treeRootGroup.rotation.y + angleDiff;
                State.rotOffset = targetTreeRotY - (0.5 - State.handX) * Math.PI * 1.6;
                gsap.to(treeRootGroup.rotation, { y: targetTreeRotY, duration: 0.45, ease: 'power2.out' });
            }

            // 使用 0 -> 1 進度補間：在每一幀動態追蹤掛點的世界座標，且飛行期間全程維持在前景層 overlayScene，絕不穿過樹體！
            const startPos = polaroidCard.position.clone();
            const startQuat = polaroidCard.quaternion.clone();
            const startScale = polaroidCard.scale.clone();
            const proxy = { t: 0 };

            gsap.to(proxy, {
                t: 1,
                duration: 0.75,
                ease: 'power2.inOut',
                onUpdate: () => {
                    treeRootGroup.updateMatrixWorld(true);
                    const targetWorldPos = new THREE.Vector3();
                    const anchorWorldQuat = new THREE.Quaternion();
                    anchorGroup.getWorldPosition(targetWorldPos);
                    anchorGroup.getWorldQuaternion(anchorWorldQuat);

                    const localInitQuat = new THREE.Quaternion().setFromEuler(initRot);
                    const targetWorldQuat = anchorWorldQuat.multiply(localInitQuat);

                    polaroidCard.position.lerpVectors(startPos, targetWorldPos, proxy.t);
                    polaroidCard.quaternion.slerpQuaternions(startQuat, targetWorldQuat, proxy.t);
                    polaroidCard.scale.lerpVectors(startScale, new THREE.Vector3(1, 1, 1), proxy.t);
                },
                onComplete: () => {
                    // 抵達樹表面掛點後，無縫歸還給 anchorGroup
                    anchorGroup.attach(polaroidCard);
                    polaroidCard.position.set(0, 0, 0);
                    polaroidCard.scale.set(1, 1, 1);
                    polaroidCard.rotation.copy(initRot);

                    controls.enableZoom = true;
                    State.activePolaroid = null;
                    if (State.viewedSet.size >= State.rawImageURLs.length) {
                        triggerEndingSequence();
                    } else {
                        State.mode = 'TREE_VIEW';
                        State.isAnimating = false;
                    }
                }
            });
        }

        function triggerEndingSequence() {
            State.mode = 'ENDING';
            playSound('finale');
            emitGoldenSparkles(1.2, 110, 4.2);

            gsap.to(treeRootGroup.rotation, { y: treeRootGroup.rotation.y + Math.PI * 1.2, duration: 1.35, ease: 'power2.inOut' });
            gsap.to(treeRootGroup.scale, {
                x: 0.001, y: 0.001, z: 0.001,
                duration: 1.35, ease: 'power3.in',
                onComplete: () => {
                    treeRootGroup.visible = false;
                    State.isAnimating = false;
                    const endingOverlay = document.getElementById('ending-overlay');
                    endingOverlay.classList.remove('hidden');
                    endingOverlay.classList.add('flex');
                    requestAnimationFrame(() => {
                        endingOverlay.style.opacity = '1';
                    });
                }
            });
        }

        // 【滑鼠點擊防穿透遮擋】同時檢測聖誕樹本體與拍立得，防止穿透樹葉點到背面的拍立得
        function onPointerDown(e) {
            if (State.mode === 'EDIT' || State.mode === 'ENDING') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (State.mode === 'CARD_CLOSED') {
                if (raycaster.intersectObject(cardGroup, true).length > 0) openPostcard();
            } else if (State.mode === 'CARD_OPEN') {
                if (raycaster.intersectObject(cardGroup, true).length > 0) dismissCardAndShowTree();
            } else if (State.mode === 'TREE_VIEW') {
                // 將聖誕樹本體與拍立得一起放入射線檢測，若第一碰撞點是樹葉，代表拍立得在樹後面被擋住了，不觸發點擊
                const hits = raycaster.intersectObjects([...polaroids, ...treeMeshesList], true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj && !obj.userData?.isPolaroid && obj.parent) obj = obj.parent;
                    if (obj && obj.userData?.isPolaroid) {
                        zoomPolaroid(obj);
                    }
                }
            } else if (State.mode === 'PHOTO_ZOOM') {
                returnPolaroidToTree();
            }
        }

        // =========================================================================
        // MediaPipe 手勢辨識
        // =========================================================================
        let gestureQueue = [];
        let lastActionTimestamp = 0;
        let mediaPipeStarted = false;

        function initMediaPipeHands() {
            if (mediaPipeStarted) return;
            mediaPipeStarted = true;

            const videoEl = document.getElementById('webcam-video');
            const canvasEl = document.getElementById('webcam-canvas');
            const ctx = canvasEl.getContext('2d');
            document.getElementById('webcam-wrapper').style.display = 'block';

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.65,
                minTrackingConfidence: 0.65
            });

            hands.onResults((results) => {
                ctx.save();
                ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
                ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#D4AF37', lineWidth: 2 });
                    drawLandmarks(ctx, lm, { color: '#B8292F', lineWidth: 1, radius: 2 });

                    const dist = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
                    const palmSize = Math.max(dist(0, 9), 0.05);

                    const extCount = [8, 12, 16, 20].filter(tip => dist(0, tip) / palmSize > 1.55).length;
                    const curlCount = [8, 12, 16, 20].filter(tip => dist(0, tip) / palmSize < 1.22).length;

                    let detected = 'IDLE';
                    if (extCount >= 4) detected = 'OPEN';
                    else if (curlCount >= 3) detected = 'FIST';

                    gestureQueue.push(detected);
                    if (gestureQueue.length > 6) gestureQueue.shift();

                    const openVotes = gestureQueue.filter(g => g === 'OPEN').length;
                    const fistVotes = gestureQueue.filter(g => g === 'FIST').length;

                    const now = Date.now();
                    if (now - lastActionTimestamp > 1200) {
                        if (openVotes >= 4) {
                            if (State.mode === 'CARD_CLOSED') { openPostcard(); lastActionTimestamp = now; }
                            else if (State.mode === 'TREE_VIEW' && polaroids.length > 0) {
                                zoomPolaroid(getNextUnviewedPolaroid());
                                lastActionTimestamp = now;
                            }
                        } else if (fistVotes >= 4) {
                            if (State.mode === 'CARD_OPEN') { dismissCardAndShowTree(); lastActionTimestamp = now; }
                            else if (State.mode === 'PHOTO_ZOOM') { returnPolaroidToTree(); lastActionTimestamp = now; }
                        }
                    }

                    State.handX = lm[9].x;
                }
                ctx.restore();
            });

            new Camera(videoEl, {
                onFrame: async () => { await hands.send({ image: videoEl }); },
                width: 320, height: 240
            }).start().catch(() => {
                document.getElementById('webcam-wrapper').style.display = 'none';
            });
        }

        // --- 啟動播放流程 ---
        function startExperienceFlow(fromShare = false) {
            if (!State.loadedGLTF) {
                alert('尚未讀取到資料夾中的 christmas_tree.glb 模型！請確認 christmas_tree.glb 與此 HTML 檔案放在同一個資料夾下。');
                return;
            }

            if (!fromShare) {
                const toVal = document.getElementById('card-to').value.trim();
                const bodyVal = document.getElementById('card-text').value.trim();
                const fromVal = document.getElementById('card-from').value.trim();
                if (toVal) State.toText = toVal;
                if (bodyVal) State.bodyText = bodyVal;
                if (fromVal) State.fromText = fromVal;
            }

            if (State.rawImageURLs.length === 0) {
                const defaultThemes = [
                    { bg: '#9E1F24', type: 'gingerbread' },
                    { bg: '#1F4E3D', type: 'bell' },
                    { bg: '#8C6239', type: 'bauble' },
                    { bg: '#2B4C6F', type: 'reindeer' }
                ];
                State.rawImageURLs = defaultThemes.map((item) => {
                    const c = document.createElement('canvas'); c.width = 600; c.height = 600;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = item.bg;
                    ctx.fillRect(0, 0, 600, 600);
                    ctx.strokeStyle = 'rgba(247,243,235,0.45)';
                    ctx.lineWidth = 10;
                    ctx.strokeRect(36, 36, 528, 528);
                    drawRefinedPolaroidMotif(ctx, 300, 300, 5.2, item.type);
                    return c.toDataURL('image/png');
                });
                State.shareImageURLs = State.rawImageURLs;
            }

            setupGLBTreeModel(State.loadedGLTF);

            cardGroup.visible = true;
            const overlay = document.getElementById('edit-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 700);

            State.mode = 'CARD_CLOSED';
            initMediaPipeHands();
        }

        // --- 主渲染迴圈 ---
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            controls.update();

            if (snowSystem) {
                const arr = snowSystem.geometry.attributes.position.array;
                for (let i = 0; i < arr.length; i += 3) {
                    arr[i] += Math.sin(elapsed * 0.6 + i) * 0.003;
                    arr[i + 1] -= 0.024;
                    if (arr[i + 1] < -9) arr[i + 1] = 16;
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
            }

            magicEffects.forEach(ef => {
                const posArr = ef.points.geometry.attributes.position.array;
                for (let i = 0; i < ef.velocities.length; i++) {
                    posArr[i * 3] += ef.velocities[i].vx;
                    posArr[i * 3 + 1] += ef.velocities[i].vy;
                    posArr[i * 3 + 2] += ef.velocities[i].vz;
                }
                ef.points.geometry.attributes.position.needsUpdate = true;
            });

            if (State.mode === 'TREE_VIEW' && !State.isAnimating) {
                polaroids.forEach(p => {
                    if (p !== State.activePolaroid) {
                        p.rotation.z = p.userData.initialRot.z + Math.sin(elapsed * 1.6 + p.userData.swayPhase) * 0.025;
                    }
                });
                const targetRotY = State.rotOffset + (0.5 - State.handX) * Math.PI * 1.6;
                treeRootGroup.rotation.y += (targetRotY - treeRootGroup.rotation.y) * 0.06;
            } else if (State.mode === 'PHOTO_ZOOM' && State.activePolaroid && !State.isAnimating) {
                const camDir = camera.getWorldDirection(new THREE.Vector3());
                const camUp = camera.up.clone().applyQuaternion(camera.quaternion).normalize();
                const lockPos = camera.position.clone()
                    .add(camDir.multiplyScalar(3.2))
                    .add(camUp.multiplyScalar(0.26));
                State.activePolaroid.position.copy(lockPos);
                State.activePolaroid.lookAt(camera.position);
            }

            renderer.clear();
            renderer.render(scene, camera);

            if (overlayScene.children.length > 2) {
                renderer.clearDepth();
                renderer.render(overlayScene, camera);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UI 事件綁定 ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (document.fonts) await document.fonts.ready;
            const isFromShareLink = await checkSharedDataFromURL();

            initThree();
            cardGroup.visible = false;
            animate();

            preloadDefaultGLB((loaded) => {
                if (loaded && isFromShareLink) {
                    startExperienceFlow(true);
                }
            });

            const textEl = document.getElementById('card-text');
            textEl.addEventListener('input', () => {
                document.getElementById('char-count').innerText = textEl.value.length;
            });

            document.getElementById('card-images').addEventListener('change', async (e) => {
                const files = Array.from(e.target.files).slice(0, 10);
                document.getElementById('upload-status').innerText = `(處理中...)`;
                State.rawImageURLs = files.map(f => URL.createObjectURL(f));
                State.shareImageURLs = await Promise.all(files.map(f => compressImageForShare(f)));
                document.getElementById('upload-status').innerText = `(已選 ${files.length}/10 張)`;

                const strip = document.getElementById('photo-preview-strip');
                strip.innerHTML = '';
                if (files.length > 0) {
                    strip.classList.remove('hidden');
                    State.rawImageURLs.forEach(url => {
                        const frame = document.createElement('div');
                        frame.className = 'bg-[#FCFBF7] p-1 pb-3 rounded-sm shadow-md border border-black/10 shrink-0 transition';
                        const img = document.createElement('img');
                        img.src = url;
                        img.className = 'w-10 h-10 object-cover';
                        frame.appendChild(img);
                        strip.appendChild(frame);
                    });
                }
            });

            document.getElementById('copy-link-end-btn').addEventListener('click', generateAndCopyShareLink);

            document.getElementById('replay-tree-btn').addEventListener('click', () => {
                const endingOverlay = document.getElementById('ending-overlay');
                endingOverlay.style.opacity = '0';
                setTimeout(() => {
                    endingOverlay.classList.add('hidden');
                    endingOverlay.classList.remove('flex');
                }, 700);

                State.viewedSet.clear();
                treeRootGroup.visible = true;
                gsap.to(treeRootGroup.scale, {
                    x: 1, y: 1, z: 1, duration: 1.2, ease: 'back.out(1.25)',
                    onComplete: () => {
                        State.mode = 'TREE_VIEW';
                    }
                });
            });

            document.getElementById('start-btn').addEventListener('click', () => startExperienceFlow(false));
        });
    </script>
</body>
</html>
